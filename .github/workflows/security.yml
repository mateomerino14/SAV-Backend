name: Security Scanning

on: [push, pull_request]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check for secrets in code
        run: |
          echo "🔍 Buscando posibles secretos hardcodeados..."
          # Buscar patrones de secretos
          if grep -r -E "(password|secret|key|token)[[:space:]]*=[[:space:]]*['\"][^'\"]{8,}" src --include="*.js" --include="*.ts" 2>/dev/null; then
            echo "⚠️  Posibles secretos encontrados!"
            exit 1
          else
            echo "✅ No se encontraron secretos aparentes"
          fi
